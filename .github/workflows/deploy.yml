# Deployment: push to main -> Astro build -> rsync dist/ to Infomaniak.
#
# Secrets to define in GitHub (Settings > Secrets and variables > Actions):
#   SSH_HOST          SSH host of the hosting account (e.g. xxx.ftp.infomaniak.com)
#   SSH_USER          SSH user
#   SSH_PRIVATE_KEY   private key whose public key is authorized on the Infomaniak side
#   DEPLOY_PATH       web root of the site (e.g. /home/clients/xxx/web/datannur.com)
#
# rsync --delete: the remote content becomes an exact mirror of dist/ —
# double-check DEPLOY_PATH before the first deployment.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

      - name: Rsync to Infomaniak
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new" \
            dist/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/"
