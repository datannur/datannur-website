# Déploiement : push sur main -> build Astro -> rsync de dist/ vers Infomaniak.
#
# Secrets à définir dans GitHub (Settings > Secrets and variables > Actions) :
#   SSH_HOST          hôte SSH de l'hébergement (ex. xxx.ftp.infomaniak.com)
#   SSH_USER          utilisateur SSH
#   SSH_PRIVATE_KEY   clé privée dont la clé publique est autorisée côté Infomaniak
#   DEPLOY_PATH       racine web du site (ex. /home/clients/xxx/web/datannur.com)
#
# rsync --delete : le contenu distant devient le miroir exact de dist/ —
# vérifier DEPLOY_PATH avant le premier déploiement.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Clé SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

      - name: Rsync vers Infomaniak
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new" \
            dist/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/"
